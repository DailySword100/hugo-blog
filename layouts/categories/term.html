{{- define "main" -}}
  <header class="category-article-header" data-aos="{{ .Site.Params.animation.options.home.post }}">
    <h1>{{ .Title }}</h1>
    <span>{{ len .Pages }} 篇文章</span>
  </header>

  <style>
    .category-article-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 18px 22px 14px;
      border-bottom: 2px solid var(--red-1);
      border-radius: 10px 10px 0 0;
      background: var(--color-wrap);
      box-shadow: var(--shadow-card);
    }

    .category-article-header h1 {
      margin: 0;
      color: var(--red-1);
      font-size: 28px;
    }

    .category-article-header span {
      flex-shrink: 0;
      color: var(--grey-7);
      font-size: 14px;
    }

    .category-article-empty {
      padding: 40px 20px;
      border-radius: 10px;
      color: var(--grey-7);
      text-align: center;
      background: var(--color-wrap);
      box-shadow: var(--shadow-card);
    }
  </style>

  {{- if gt (len .Pages) 0 -}}
    {{- range $articleIndex, $article := .Pages.ByWeight -}}
      {{- partial "post.html" (dict "index" $articleIndex "ctx" $ "page" $article) -}}
    {{- end -}}
  {{- else -}}
    <p class="category-article-empty">暂无文章，后续补充。</p>
  {{- end -}}
{{- end -}}
